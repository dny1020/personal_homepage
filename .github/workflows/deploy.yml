name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never interrupt a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Transpile JSX
        run: |
          # Install locally so babel can resolve the preset from the workspace
          npm install --no-save --no-package-lock --silent \
            @babel/core@7 @babel/cli@7 @babel/preset-react@7
          npx babel frontend/app.jsx --out-file frontend/app.js --presets=@babel/preset-react

      - name: Check resume.pdf is current
        run: |
          # data.json is the source of truth; the PDF must not lag behind it.
          pipx install uv >/dev/null 2>&1 || pip install --quiet uv
          before=$(sha256sum frontend/resume.pdf | cut -d' ' -f1)
          uv run --with fpdf2 python scripts/generate_resume.py
          after=$(sha256sum frontend/resume.pdf | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "::error::frontend/resume.pdf is stale. Run: uv run --with fpdf2 python scripts/generate_resume.py"
            exit 1
          fi

      - name: Drop the JSX source
        run: rm frontend/app.jsx

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
